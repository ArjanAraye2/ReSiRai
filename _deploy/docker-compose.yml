name: resirai

networks:
  default:
    name: arjanpeyman_default
    external: true
    # Ú©Ø§Ù†ØªÙ†Ø±Ù postgresql Ø¨Ø§ alias db Ø±ÙˆÛŒ Ù‡Ù…ÛŒÙ† Ø´Ø¨Ú©Ù‡ Ø§Ø³Øª

volumes:
  images:
    name: resirai_images
  backup:
    name: resirai_backup
  keys:
    name: resirai_keys

services:
  resirai:
    image: resirai:20261025a
    container_name: resirai
    restart: unless-stopped
    ports:
      - "127.0.0.1:5075:8080"
    environment:
      ReSiRaiConfig: /app/config/ReSiRai.config.json
    volumes:
      - ./config/ReSiRai.config.json:/app/config/ReSiRai.config.json:ro
      - images:/var/lib/ReSiRai/images
      - backup:/var/lib/ReSiRai/backup
      - keys:/var/lib/ReSiRai/keys
