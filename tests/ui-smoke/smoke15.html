<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>smoke15</title>
<style>body{font-family:Tahoma,Arial,sans-serif;background:#eef4f9;margin:0;padding:16px;color:#123}#log{font-size:12px;direction:ltr;white-space:pre-wrap;background:#fff;border:1px solid #dbe4ec;border-radius:12px;padding:12px}</style>
</head>
<body>
<!-- نگهبانِ «بیمار بدونِ ناوبری» (۱۴۰۵/۰۷/۱۶):
     ۱) فرمِ بیمارِ جدید و ویرایش **درونِ خودِ پرونده** (#patientDetailsSection) رندر می‌شوند، نه صفحهٔ جدا.
     ۲) «بیمار جدید» پرونده را همه‌جا نگه می‌دارد — فقط فرم زیرِ ناحیه‌ها باز می‌شود.
     ۳) «ثبت بیمار» فرم را جمع می‌کند و فهرست را تازه می‌کند، بدونِ خروج از صفحه.
     ۴) پیش‌نویسِ مراجعه در همین لحظه مخفی می‌شود.
     ۵) دکمه‌های «انصراف» در فرم‌ها فقط فرم را جمع می‌کنند (ناوبریِ صفحات حذف).
     DOM از index.html واقعی و کدها از کپیِ تازهٔ verify.ps1 است. -->
<script>
  var realFetch = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    var u = String(url), method = (opts && opts.method) || "GET";
    var json = function (p) { return Promise.resolve(new Response(JSON.stringify(p), { status: 200, headers: { "Content-Type": "application/json" } })); };
    if (u.indexOf("/api/patients") >= 0 && method === "POST") {
      window.__posted = { url: u, body: JSON.parse(opts.body) };
      return json({ success: true, patientID: 9 });
    }
    if (u.indexOf("/api/patients/") >= 0 && u.indexOf("/details") >= 0) {
      var id = (u.match(/\/patients\/(\d+)\/details/) || [])[1] || 3;
      var patientPayload = { patientID: Number(id), firstName: "جان", lastName: "دو", gender: 1, isActive: true, nationalCode: "0000" + id };
      return json({ success: true, patient: patientPayload, studies: [], studyCount: 0, totalImageCount: 0 });
    }
    if (u.indexOf("/api/patients") >= 0 && method === "GET")
      return json({ success: true, patients: [{ patientID: 3, firstName: "جان", lastName: "دو", mobile: "3", nationalCode: "3" }, { patientID: 9, firstName: "نمونه", lastName: "آزمونی", mobile: "9", nationalCode: "9999999999" }], statistics: {}, count: 2, totalCount: 2, offset: 0, hasMore: false });
    if (u.indexOf("/api/staff/doctors") >= 0)
      return json({ success: true, doctors: [{ staffID: 11, firstName: "دکتر", lastName: "نمونه", specialtyID: 11, specialtyName: "پزشکی عمومی" }] });
    if (u.indexOf("/api/visit-context") >= 0)
      return json({ success: true, clinicID: 1, doctorStaffID: 11, doctorName: "دکتر نمونه", specialtyID: 11, canPickDoctor: false });
    if (u.indexOf("/api/") >= 0)
      return json({ success: true, sections: [], factors: [], values: [], history: [], toothNumbers: [], study: {}, studyTypes: [], waitStages: [], insuranceTypes: [], options: [] });
    return realFetch(url, opts);
  };
  window.confirm = function () { return true; };
  window.SpeechRecognition = window.SpeechRecognition || function(){ this.start=function(){}; this.stop=function(){}; };
  window.webkitSpeechRecognition = window.SpeechRecognition;
</script>
<script>
(async function () {
  var results = [];
  var check = function (name, cond, extra) { results.push({ name: name, ok: !!cond, extra: extra == null ? "" : String(extra) }); };
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var loadScript = function (src) { return new Promise(function (res, rej) { var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error("load failed: "+src)); }; document.body.appendChild(s); }); };
  try {
    var html = "";
    try { html = await (await fetch("index.html", { cache: "no-store" })).text(); }
    catch (e) { document.title = "SMOKE-15-NEEDSSERVER (serve.ps1 را اجرا کن)"; return; }
    var parsed = new DOMParser().parseFromString(html, "text/html");
    parsed.querySelectorAll("script").forEach(function (n) { n.remove(); });
    document.body.replaceChildren(...Array.from(parsed.body.childNodes).map(function (n) { return document.importNode(n, true); }));

    /* ---- قراردادِ HTML ---- */
    check("patient-forms-inside-record",
      !!document.getElementById("patientFormHost") &&
      !!document.getElementById("patientFormHost").querySelector("#newPatientSection") &&
      !!document.getElementById("patientFormHost").querySelector("#editPatientSection") &&
      !!document.getElementById("patientFormHost").querySelector("#newPatientSection").closest("#patientDetailsSection"),
      "patientFormHost");
    check("old-sections-moved", document.body.children.length > 0);

    await loadScript("app.js");
    await loadScript("visit-draft.js");
    await loadScript("dictation.js");
    await wait(300);

    /* ---- باز کردنِ فرمِ بیمارِ جدید: بدونِ خروج از پرونده ---- */
    await openPatient(3);
    await wait(500);
    document.getElementById("newPatientButton").click();
    await wait(300);
    check("new-form-opens-inside-record", !document.getElementById("newPatientSection").classList.contains("hidden") &&
      !!document.getElementById("newPatientSection").closest("#patientDetailsSection"));
    check("form-hides-draft", !document.getElementById("visitDraftHost").firstElementChild);
    check("form-still-in-record", !!document.getElementById("newPatientSection").closest("#patientDetailsSection"));

    /* ---- ثبتِ بیمار جدید: فرم جمع و بدونِ تغییر صفحه ---- */
    // فرم را واقعاً پُر می‌کنیم تا createPatient با اعتبارسنجیِ واقعی اجرا شود.
    window.ReSiRaiDictation && window.ReSiRaiDictation.remount && window.ReSiRaiDictation.remount();
    var fFn = document.getElementById("newFirstName"), fLn = document.getElementById("newLastName");
    var fNc = document.getElementById("newNationalCode"), fG = document.getElementById("newGender");
    if (fFn) fFn.value = "نمونه";
    if (fLn) fLn.value = "آزمونی";
    if (fNc) fNc.value = "9999999999";
    if (fG) fG.value = "1";
    if (typeof createPatient === "function") await createPatient();
    else document.getElementById("newPatientForm").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
    await wait(900);
    check("form-closed-after-create", document.getElementById("newPatientSection").classList.contains("hidden"));
    check("posted-payload", !!window.__posted && !!window.__posted.body.nationalCode, window.__posted && JSON.stringify(window.__posted.body.nationalCode));

    /* ---- ویرایشِ بیمار: درونِ پرونده (دکمهٔ ویرایش در ردیفِ پرونده) ---- */
    var editPod = document.createElement("div"); editPod.id = "smokeEditPod"; editPod.appendChild(document.createElement("span"));
    document.getElementById("patientDetailsSection").appendChild(editPod);
    // روش مستقیم: بازکردنِ پرونده با id واقعی، بعد فرم
    await openPatient(3);
    await wait(700);
    var row = document.querySelector(".patient-list-row .patient-edit-button");
    if (!row) { row = document.querySelector(".patient-edit-button"); }
    check("edit-button-in-row", !!row, row ? "found" : "missing");
    if (row) row.click();
    await wait(1300);
    check("edit-form-opens-inside-record", !document.getElementById("editPatientSection").classList.contains("hidden") &&
      !!document.getElementById("editPatientSection").closest("#patientDetailsSection"));
    document.getElementById("cancelEditPatientButton").click();
    await wait(300);
    check("cancel-edit-stays-in-record", document.getElementById("editPatientSection").classList.contains("hidden") &&
      !!document.getElementById("editPatientSection").closest("#patientDetailsSection"));

    /* ---- انصراف در بیمار جدید ---- */
    document.getElementById("newPatientButton").click();
    await wait(300);
    document.getElementById("cancelNewPatientButton").click();
    await wait(300);
    check("cancel-new-stays-in-record", document.getElementById("newPatientSection").classList.contains("hidden") &&
      !!document.getElementById("newPatientSection").closest("#patientDetailsSection"));
  } catch (e) {
    results.push({ name: "exception", ok: false, extra: (e && e.message) || String(e) });
  }

  var failed = results.filter(function (r) { return !r.ok; });
  var log = document.createElement("pre");
  log.id = "log";
  log.textContent = results.map(function (r) { return (r.ok ? "PASS " : "FAIL ") + r.name + (r.extra ? " :: " + r.extra : ""); }).join("\n");
  document.body.appendChild(log);
  document.title = failed.length ? "SMOKE-15-FAIL " + failed[0].name + " " + failed[0].extra : "SMOKE-15-PASS (" + results.length + " checks)";
})();
</script>
</body>
</html>
