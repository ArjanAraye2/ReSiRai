<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>SMOKE-9-RUN</title>
<link rel="stylesheet" href="study-sections.css">
<style>
  body { font-family: Tahoma, Arial, sans-serif; background:#eef4f9; margin:0; padding:16px; color:#123 }
  .card { background:#fff; border:1px solid #dbe4ec; border-radius:12px; padding:14px; max-width:820px }
  #log { font-size:12px; direction:ltr; white-space:pre-wrap }
</style>
</head>
<body>
<div class="card">
  <div id="studySectionsPanel"></div>
</div>
<pre id="log"></pre>

<script>
/* نگهبانِ ادغامِ فرمِ مراجعه (۱۴۰۵/۰۷/۱۲):
   - فرمِ «ثبتِ مراجعهٔ جدید» و «ویرایش مراجعه» باید یک بخشِ DOM واحد باشند؛
     دیگر #newStudySection وجود ندارد و همهٔ فیلدهای مشترک داخلِ #studyDetailsSection‌اند.
   - شمای دندان باید مخفی (display:none) بماند، نه حذف.
   - بخش‌هایِ مراجعه در حالتِ جدید بافر می‌شوند و بلافاصله بعد از ثبت با POST ذخیره شوند.
   - «فیلدهای اضافه» با SHOW_EXTRA_FIELDS=false نباید رندر شوند. */
"use strict";
window.__posts = [];
window.__lastPost = null;
window.__calls = [];
var server = { sections: [] };
window.confirm = function () { return true; };
var realFetch = window.fetch ? window.fetch.bind(window) : null;
window.fetch = async function (url, options) {
  options = options || {};
  var u = String(url);
  var method = options.method || "GET";
  var isApi = u.indexOf("/api/") >= 0;
  if (!isApi) {                      // index.html و بقیهٔ فایلها باید واقعاً خوانده شوند
    if (realFetch) return realFetch(url, options);
    throw new Error("no real fetch available for " + u);
  }
  window.__calls.push({ url: u, method: method });
  var json = function (payload) { return { ok: true, status: 200, json: async function () { return payload; } }; };
  if (method === "GET") return json({ success: true, sections: server.sections });
  if (method === "POST") {
    var body = JSON.parse(options.body);
    window.__lastPost = body;
    window.__posts.push({ url: u, body: body });
    var idx = -1;
    for (var i = 0; i < server.sections.length; i++) if (server.sections[i].sectionCode === body.sectionCode) idx = i;
    var row = {
      studySectionID: idx >= 0 ? server.sections[idx].studySectionID : server.sections.length + 1,
      sectionCode: body.sectionCode, title: body.title, data: body.data,
      recordedAt: new Date().toISOString(), modifiedDate: idx >= 0 ? new Date().toISOString() : null
    };
    if (idx >= 0) server.sections[idx] = row; else server.sections.push(row);
    return json({ success: true, created: idx < 0, section: row });
  }
  if (method === "DELETE") {
    var code = new URL("http://x" + u).searchParams.get("sectionCode");
    server.sections = server.sections.filter(function (s) { return s.sectionCode !== code; });
    return json({ success: true });
  }
  return { ok: false, status: 405, json: async function () { return { success: false }; } };
};
</script>
<script src="study-sections.js"></script>
<script>
(async function () {
  var results = [];
  var check = function (name, cond, extra) {
    results.push({ name: name, ok: !!cond, extra: extra == null ? "" : String(extra) });
  };
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.from((r || document).querySelectorAll(s)); };

  try {
    /* ---------- ۱) index.html: یک بخشِ واحد ---------- */
    var html = "";
    try {
      var res = await fetch("index.html", { cache: "no-store" });
      html = await res.text();
    } catch (e) {
      document.getElementById("log").textContent = "index.html could not be fetched: " + e.message;
      document.title = "SMOKE-9-NEEDSSERVER (serve.ps1 را اجرا کن)";
      return;
    }
    var doc = new DOMParser().parseFromString(html, "text/html");

    check("old-new-study-section-removed", !doc.getElementById("newStudySection"));
    check("single-details-section", !!doc.getElementById("studyDetailsSection"));
    var form = doc.getElementById("studyDetailsSection") && doc.getElementById("studyDetailsSection").querySelector("form");
    check("one-form-inside-section", !!form && form.id === "newStudyForm", form && form.id);
    check("no-second-study-form", doc.querySelectorAll("form").length >= 1 && !doc.getElementById("studyDetailsForm"));

    // فیلدهای مشترک همه داخلِ همان یک بخش‌اند
    var common = ["newStudyType", "newStudyDate", "newBodyPart", "newStudyDescription", "newStudyDiagnosis",
      "studyDetailsWorkEndDate", "studyDetailsWorkEndButton",
      "studyDetailsStatus2", "studyDetailsFollowUpDate", "studyDetailsFollowUpNote",
      "studySectionsPanel", "studyFactorsPanel", "newStudySubmitButton",
      "studyDetailsSaveButton", "studyDetailsEditButton", "studyDetailsCancelButton"];
    var missing = common.filter(function (id) { return !doc.getElementById(id); });
    check("shared-fields-in-one-form", missing.length === 0, missing.join(","));
    common.forEach(function (id) {
      var el = doc.getElementById(id);
      if (!el) return;
      check("field-" + id + "-inside-section", !!el.closest("#studyDetailsSection"));
    });

    // شمای دندان: مخفی، نه حذف
    var chart = doc.getElementById("studyDetailsTeethChart");
    var chartCard = chart && chart.closest("section");
    check("teeth-chart-present", !!chart);
    check("teeth-chart-card-hidden",
      !!chartCard && /display\s*:\s*none/.test(chartCard.getAttribute("style") || ""),
      chartCard && chartCard.getAttribute("style"));

    // شناسه‌های تکراری نباید پیش بیاید (علتِ خاموش‌شدنِ فیلدها)
    var ids = Array.from(doc.querySelectorAll("[id]")).map(function (n) { return n.id; });
    var seen = {}, dup = [];
    ids.forEach(function (id) { if (seen[id]) dup.push(id); seen[id] = true; });
    check("no-duplicate-ids", dup.length === 0, dup.join(","));

    /* ---------- ۲) بخش‌های مراجعه: حالتِ پیش‌نویس ---------- */
    await window.ReSiRaiStudySections.render(0);
    await sleep(60);
    var panel = document.getElementById("studySectionsPanel");
    check("draft-template-rendered", $$(".gsec", panel).length === 10, $$(".gsec", panel).length);
    check("draft-note-shown", (panel.textContent || "").indexOf("مراجعه هنوز ثبت نشده") >= 0);

    /* ---------- ۳) فیلدهای اضافه باید پنهان باشند ---------- */
    var anam = $('.gsec[data-id="anamnesis"]', panel);
    var vit = $('.gsec[data-id="vitals"]', panel);
    var bp = $('.gsec[data-id="bp"]', panel);
    var life = $('.gsec[data-id="life"]', panel);

    // سه بخشِ افزودنی (بارداری/کودک/سالمندی) اول باید از دیالوگ «+ بخشِ دیگر» اضافه شوند
    var openAddDialog = function () {
      if (!document.querySelector(".gs-dialog.open")) document.querySelector(".gs-add").click();
    };
    var addExtraByTitle = function (frag) {
      openAddDialog();
      var opt = Array.from(document.querySelectorAll(".gs-opt")).filter(function (x) {
        var s = x.querySelector("span");
        return s && s.textContent.indexOf(frag) >= 0;
      })[0];
      if (opt) opt.querySelector("button").click();
    };
    ["بارداری", "کودک", "سالمندی"].forEach(addExtraByTitle);
    var peds = $('.gsec[data-id="peds"]', panel);
    var geri = $('.gsec[data-id="geri"]', panel);
    var ante = $('.gsec[data-id="ante"]', panel);

    // مثبت: فیلدهای تأییدشده باید باشند
    check("base-anamnesis-visible", anam.textContent.indexOf("شکایتِ اصلی") >= 0);
    check("base-vitals-visible", vit.textContent.indexOf("وزن") >= 0 && vit.textContent.indexOf("قد") >= 0);
    check("base-life-visible", life.textContent.indexOf("فعالیتِ بدنی") >= 0);
    check("extras-added", !!peds && !!geri && !!ante, [!!peds, !!geri, !!ante].join(","));
    if (peds) check("base-peds-visible", peds.textContent.indexOf("کم‌رشد") >= 0);
    if (geri) check("base-geri-visible", geri.textContent.indexOf("مکرر") >= 0);

    var extraShouldBeGone = [
      [anam, "داروهای مصرفی"], [anam, "سابقهٔ خانوادگی"],
      [vit, "تنفس"], [vit, "دورِ کمر"], [vit, "محلِ اندازه‌گیریِ دما"],
      [bp, "وضعیتِ دارو"], [bp, "توضیح"],
      [life, "کیفیتِ خواب"],
      [peds, "درصدِ منحنی"], [peds, "واکسیناسیون"],
      [geri, "تعداد دارو در روز"],
      [ante, "سونوگرافی"]
    ];
    extraShouldBeGone.forEach(function (row, i) {
      var found = row[0] && row[0].textContent.indexOf(row[1]) >= 0;
      check("extra-hidden-" + i + "-" + row[1], !found, found ? "still rendered" : "");
    });

    /* ---------- ۴) بافرِ پیش‌نویس و flush پس از ثبت ---------- */
    anam.querySelector(".gsec-head").click();
    var chief = anam.querySelector('[data-group="chief"]');
    var chip = chief.querySelector(".gsec-chip");
    chip.click();
    anam.querySelector("[data-save]").click();
    await sleep(60);
    check("draft-confirm-makes-no-post", window.__posts.length === 0, JSON.stringify(window.__posts));
    check("draft-marked-recorded", anam.classList.contains("recorded") &&
      anam.querySelector(".gsec-badge").textContent.indexOf("✓ ثبت شد") === 0,
      anam.querySelector(".gsec-badge").textContent);

    var saved = await window.ReSiRaiStudySections.flushPending(7);
    await sleep(30);
    check("flush-saved-one", saved === 1, saved);
    check("flush-posts-to-new-study",
      window.__posts.length === 1 && window.__posts[0].url === "/api/studies/7/sections",
      JSON.stringify(window.__posts.map(function (p) { return p.url; })));
    check("flush-payload-intact",
      window.__posts[0] && window.__posts[0].body.sectionCode === "anamnesis" &&
      window.__posts[0].body.data && window.__posts[0].body.data.chips &&
      window.__posts[0].body.data.chips.chief === chip.dataset.v,
      JSON.stringify(window.__posts[0] && window.__posts[0].body.data));

    // بازخوانی برای همان مراجعه باید بخشِ ثبت‌شده را نشان دهد
    await window.ReSiRaiStudySections.render({ studyID: 7 });
    await sleep(60);
    var anam2 = $('.gsec[data-id="anamnesis"]', panel);
    check("flushed-section-visible", anam2.classList.contains("recorded"));
    check("flushed-chip-restored", !!anam2.querySelector('[data-group="chief"] .gsec-chip.on'));

    // پس از flush، دوباره flush کردن نباید چیزی بفرستد
    var again = await window.ReSiRaiStudySections.flushPending(7);
    check("flush-is-idempotent", again === 0 && window.__posts.length === 1, again);

    // resetDraft باید بافر را خالی کند
    await window.ReSiRaiStudySections.render(0);
    await sleep(40);
    window.ReSiRaiStudySections.resetDraft();
    var anam3 = $('.gsec[data-id="anamnesis"]', panel);
    check("reset-clears-draft", anam3 && !anam3.classList.contains("recorded"));
  } catch (e) {
    results.push({ name: "exception", ok: false, extra: (e && e.message) || String(e) });
  }

  var failed = results.filter(function (r) { return !r.ok; });
  document.getElementById("log").textContent = results.map(function (r) {
    return (r.ok ? "PASS " : "FAIL ") + r.name + (r.extra ? " :: " + r.extra : "");
  }).join("\n");
  document.title = failed.length
    ? "SMOKE-9-FAIL " + failed[0].name + " " + failed[0].extra
    : "SMOKE-9-PASS (" + results.length + " checks)";
})();
</script>
</body>
</html>
