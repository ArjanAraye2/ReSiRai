name: Mobile login layout audit
on:
  push:
    branches: [codex/mobile-login-audit]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: node tests/mobile-login-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-login-audit
          path: mobile-login-audit/
          retention-days: 5
